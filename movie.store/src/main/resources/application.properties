spring.application.name=movie.store

# Server port
server.port=5173

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/movie_store_db
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Ticket pricing: member discount for logged-in customers, VAT on the discounted price
moviestore.pricing.member-discount-percent=5
moviestore.pricing.vat-percent=10

# Login token lifetime (hours)
moviestore.auth.token-hours=12

