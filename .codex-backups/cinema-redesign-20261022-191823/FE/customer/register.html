<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký | Movie Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width:420px">
    <h1 class="h4 mb-4">Đăng ký tài khoản</h1>
    <form id="reg-form" class="card card-body shadow-sm">
      <div class="mb-3">
        <label class="form-label">Họ tên</label>
        <input type="text" id="fullName" class="form-control" required maxlength="100">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Mật khẩu</label>
        <input type="password" id="password" class="form-control" required minlength="6">
      </div>
      <button class="btn btn-success w-100">Tạo tài khoản</button>
      <p class="mt-3 mb-0 text-center"><a href="login.html">Đã có tài khoản?</a></p>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.getElementById("reg-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const { data } = await userApi.register({
          fullName: document.getElementById("fullName").value.trim(),
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
          role: "CUSTOMER",
        });
        setUser(data);
        alert("Đăng ký thành công!");
        location.href = "index.html";
      } catch (err) {
        handleError(err, "Không đăng ký được (email có thể đã tồn tại)");
      }
    });
  </script>
</body>
</html>
