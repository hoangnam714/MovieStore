<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chọn ghế | Movie Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .seat-grid { display: flex; flex-wrap: wrap; gap: 8px; max-width: 520px; }
    .seat {
      width: 44px; height: 44px; border-radius: 6px; border: 1px solid #ccc;
      background: #fff; cursor: pointer; font-size: 12px;
    }
    .seat.booked { background: #dee2e6; color: #999; cursor: not-allowed; }
    .seat.selected { background: #0d6efd; color: #fff; border-color: #0d6efd; }
  </style>
</head>
<body class="bg-light">
  <div class="container py-4">
    <a href="index.html">← Suất chiếu</a>
    <h1 class="h4 mt-2" id="title">Chọn ghế</h1>
    <p id="meta" class="text-muted"></p>
    <div class="seat-grid mb-3" id="seats"></div>
    <p>Đã chọn: <strong id="picked">—</strong></p>
    <button class="btn btn-success" id="book-btn" disabled>Xác nhận mua vé</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    const user = getUser();
    if (!user) {
      alert("Vui lòng đăng nhập để mua vé");
      location.href = "login.html";
    }
    const params = new URLSearchParams(location.search);
    const showtimeId = Number(params.get("showtimeId"));
    const selected = new Set();
    let showtime = null;
    let booked = new Set();

    async function init() {
      const { data } = await showtimeApi.get(showtimeId);
      showtime = data;
      document.getElementById("title").textContent = data.movieTitle;
      document.getElementById("meta").textContent =
        `${data.roomName} · ${formatDateTime(data.startTime)} · ${formatMoney(data.ticketPrice)}/vé`;
      const seatsRes = await ticketApi.bookedSeats(showtimeId);
      booked = new Set(seatsRes.data);
      renderSeats();
    }

    function renderSeats() {
      const grid = document.getElementById("seats");
      grid.innerHTML = "";
      for (let i = 1; i <= showtime.seatCount; i++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "seat";
        btn.textContent = i;
        if (booked.has(i)) btn.classList.add("booked");
        else btn.onclick = () => toggleSeat(i, btn);
        if (selected.has(i)) btn.classList.add("selected");
        grid.appendChild(btn);
      }
      updatePicked();
    }

    function toggleSeat(n, btn) {
      if (selected.has(n)) {
        selected.delete(n);
        btn.classList.remove("selected");
      } else {
        selected.add(n);
        btn.classList.add("selected");
      }
      updatePicked();
    }

    function updatePicked() {
      const arr = [...selected].sort((a, b) => a - b);
      document.getElementById("picked").textContent = arr.length ? arr.join(", ") : "—";
      document.getElementById("book-btn").disabled = arr.length === 0;
    }

    document.getElementById("book-btn").onclick = async () => {
      try {
        const { data } = await ticketApi.book({
          userId: user.id,
          showtimeId,
          seatNumbers: [...selected],
        });
        alert(`Mua thành công ${data.length} vé!`);
        location.href = "my-tickets.html";
      } catch (e) {
        handleError(e, "Không mua được vé (ghế có thể đã bán)");
        const seatsRes = await ticketApi.bookedSeats(showtimeId);
        booked = new Set(seatsRes.data);
        selected.clear();
        renderSeats();
      }
    };

    init().catch(() => alert("Suất chiếu không hợp lệ"));
  </script>
</body>
</html>
