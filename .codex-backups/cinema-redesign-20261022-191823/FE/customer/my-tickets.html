<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vé của tôi | Movie Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Movie Store</a>
    </div>
  </nav>
  <main class="container py-4">
    <h1 class="h4">Vé đã mua</h1>
    <table class="table table-striped" id="tbl">
      <thead><tr><th>Phim</th><th>Phòng</th><th>Suất</th><th>Ghế</th><th>Giá</th><th>Đặt lúc</th></tr></thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    const user = getUser();
    if (!user) location.href = "login.html";
    ticketApi.byUser(user.id).then(({ data }) => {
      const tbody = document.querySelector("#tbl tbody");
      if (!data.length) {
        tbody.innerHTML = "<tr><td colspan='6'>Chưa có vé</td></tr>";
        return;
      }
      tbody.innerHTML = data.map((t) => `<tr>
        <td>${t.movieTitle}</td><td>${t.roomName}</td><td>${formatDateTime(t.startTime)}</td>
        <td>${t.seatNumber}</td><td>${formatMoney(t.price)}</td><td>${formatDateTime(t.bookedAt)}</td>
      </tr>`).join("");
    });
  </script>
</body>
</html>
