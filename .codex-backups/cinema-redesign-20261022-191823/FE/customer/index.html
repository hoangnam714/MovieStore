<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đặt vé xem phim | Movie Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Movie Store</a>
      <div class="navbar-nav ms-auto">
        <span class="nav-link text-light" id="user-label"></span>
        <a class="nav-link" href="my-tickets.html">Vé của tôi</a>
        <a class="nav-link" href="login.html" id="auth-link">Đăng nhập</a>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    <h1 class="h3 mb-3">Suất chiếu sắp tới</h1>
    <p class="text-muted">Chọn suất → chọn ghế → xác nhận mua vé (cần đăng nhập).</p>
    <div id="showtime-list" class="row g-3"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    const u = getUser();
    const label = document.getElementById("user-label");
    const authLink = document.getElementById("auth-link");
    if (u) {
      label.textContent = u.fullName;
      authLink.textContent = "Đăng xuất";
      authLink.href = "#";
      authLink.onclick = (e) => { e.preventDefault(); clearUser(); location.reload(); };
    }

    async function loadShowtimes() {
      const el = document.getElementById("showtime-list");
      try {
        const { data } = await showtimeApi.upcoming();
        if (!data.length) {
          el.innerHTML = "<p class='text-muted'>Chưa có suất chiếu. Admin tạo suất tại CMS.</p>";
          return;
        }
        el.innerHTML = data.map((s) => `
          <div class="col-md-6">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <h2 class="h5 card-title">${s.movieTitle}</h2>
                <p class="mb-1"><strong>${s.roomName}</strong> · ${s.seatCount} ghế</p>
                <p class="mb-1">${formatDateTime(s.startTime)} · ${s.movieDuration} phút</p>
                <p class="text-primary fw-bold">${formatMoney(s.ticketPrice)} / vé</p>
                <a class="btn btn-primary" href="booking.html?showtimeId=${s.id}">Chọn ghế</a>
              </div>
            </div>
          </div>`).join("");
      } catch (e) {
        el.innerHTML = "<p class='text-danger'>Không kết nối API. Chạy MovieStore - Full Stack trong Eclipse (backend cổng 5173).</p>";
      }
    }
    loadShowtimes();
  </script>
</body>
</html>
