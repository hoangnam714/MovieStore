services:
  mysql:
    image: mysql:8.4
    container_name: moviestore-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: movie_store_db
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - moviestore_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  moviestore_mysql_data:
