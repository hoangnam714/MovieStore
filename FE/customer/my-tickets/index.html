<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vé của tôi | Movie Store</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <link rel="stylesheet" href="../../assets/css/customer.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="header"></header>
    <main id="main">
      <div class="wrap">
        <div class="section-head">
          <div>
            <span class="eyebrow">NHỮNG BUỔI HẸN ĐIỆN ẢNH</span>
            <h2>Vé của tôi</h2>
            <p class="muted">Mọi thông tin bạn cần trước khi đến rạp.</p>
          </div>
          <a class="btn light" href="/customer/home/index.html">Đặt thêm vé ↗</a>
        </div>
        <div id="tickets" class="ticket-grid"></div>
      </div>
    </main>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/customer-layout.js"></script>
    <script>
      function getTickets() {
        const currentUser = getUser();
        if (!currentUser) {
          location.href = "/customer/login/index.html?next=/customer/my-tickets/index.html";
          return;
        }

        return ticketApi
          .byUser(currentUser.id)
          .then((response) => {
            const data = response.data;
            document.getElementById("tickets").innerHTML =
              data
                .map(
                  (ticket) =>
                    `
                      <article class="ticket">
                        <span class="ticket-code">MOVIESTORE · #${String(ticket.id).padStart(6, "0")}</span>
                        <h3>${getSafeHtml(ticket.movieTitle)}</h3>
                        <p class="muted">${getSafeHtml(ticket.roomName)} · ${getDateTime(ticket.startTime)}</p>
                        <div class="total">
                          <span>
                            Ghế
                            <b>${getSeatLabel(ticket.seatNumber)}</b>
                          </span>
                          <strong>${getMoney(ticket.price)}</strong>
                        </div>
                        <span class="tiny muted">Đã đặt: ${getDateTime(ticket.bookedAt)}</span>
                      </article>
                    `
                )
                .join("") || '<div class="empty">Bạn chưa có vé. Một bộ phim hay đang chờ bạn!</div>';
          })
          .catch((error) => {
            console.error(error);
          });
      }

      getTickets();
    </script>
  </body>
</html>
