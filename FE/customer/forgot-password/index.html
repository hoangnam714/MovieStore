<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quên mật khẩu | Movie Store</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/customer.css" />
  </head>
  <body>
    <header id="header"></header>
    <main id="main">
      <div class="auth-layout">
        <section class="auth-art">
          <h1>
            Quên mật khẩu cũng không sao.
          </h1>
          <p>Xác nhận email và số điện thoại đã đăng ký để đặt mật khẩu mới.</p>
          <img
            class="film-poster"
            src="https://image.tmdb.org/t/p/w500/q719jXXEzOoYaps6babgKnONONX.jpg"
            alt="Poster Your Name"
            referrerpolicy="no-referrer"
          />
        </section>
        <section class="auth-form">
          <span class="eyebrow">KHÔI PHỤC TÀI KHOẢN</span>
          <h1>Quên mật khẩu</h1>
          <p class="muted">Nhập đúng email và số điện thoại bạn đã dùng khi đăng ký.</p>
          <form id="auth-form" onsubmit="onResetPassword(event)">
            <label class="field">
              Email
              <input
                name="email"
                type="email"
                class="input"
                required
                autocomplete="email"
                placeholder="ban@example.com"
              />
            </label>
            <label class="field">
              Số điện thoại đã đăng ký
              <input
                name="phone"
                type="tel"
                inputmode="tel"
                class="input"
                required
                maxlength="15"
                autocomplete="tel"
                placeholder="0912 345 678"
              />
            </label>
            <label class="field">
              Mật khẩu mới
              <input
                name="newPassword"
                type="password"
                class="input"
                required
                minlength="6"
                autocomplete="new-password"
                placeholder="Tối thiểu 6 ký tự"
              />
            </label>
            <label class="field">
              Xác nhận mật khẩu mới
              <input
                name="confirmPassword"
                type="password"
                class="input"
                required
                minlength="6"
                autocomplete="new-password"
                placeholder="Nhập lại mật khẩu mới"
              />
            </label>
            <p id="auth-error" class="error tiny" role="alert"></p>
            <button id="auth-submit" class="btn full" type="submit">Đặt lại mật khẩu ↗</button>
          </form>
          <p class="auth-foot">
            Nhớ ra mật khẩu?
            <a href="../login/index.html">Đăng nhập</a>
          </p>
        </section>
      </div>
    </main>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/customer-layout.js"></script>
    <script>
      const PHONE_PATTERN = /^(0|\+84)[35789]\d{8}$/;

      function onResetPassword(event) {
        event.preventDefault();
        const form = event.target;
        const errorNode = document.getElementById("auth-error");
        const submitButton = document.getElementById("auth-submit");
        const data = Object.fromEntries(new FormData(form));
        data.email = data.email.trim();
        data.phone = data.phone.replace(/[\s.-]/g, "");
        errorNode.textContent = "";
        if (!PHONE_PATTERN.test(data.phone)) {
          errorNode.textContent = accountErrorMessages["Phone number must be a valid Vietnamese mobile number"];
          form.elements.phone.focus();
          return;
        }
        if (data.newPassword !== data.confirmPassword) {
          errorNode.textContent = accountErrorMessages["Password confirmation does not match"];
          form.elements.confirmPassword.focus();
          return;
        }
        submitButton.disabled = true;

        return userApi
          .resetPassword(data)
          .then(() => {
            // The reset logs the account out everywhere, including this browser.
            onLogout();
            location.href = "../login/index.html?reset=1";
          })
          .catch((error) => {
            errorNode.textContent = getAccountErrorMessage(error, "Chưa đặt lại được mật khẩu. Vui lòng thử lại.");
            submitButton.disabled = false;
          });
      }
    </script>
  </body>
</html>
