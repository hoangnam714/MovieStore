<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | Movie Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width:420px">
    <h1 class="h4 mb-4">Đăng nhập</h1>
    <form id="login-form" class="card card-body shadow-sm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required value="khach@moviestore.vn">
      </div>
      <div class="mb-3">
        <label class="form-label">Mật khẩu</label>
        <input type="password" id="password" class="form-control" required value="khach123">
      </div>
      <button class="btn btn-primary w-100">Đăng nhập</button>
      <p class="mt-3 mb-0 text-center"><a href="register.html">Đăng ký</a> · <a href="index.html">Trang chủ</a></p>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const { data } = await userApi.login({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        });
        setUser(data);
        location.href = "index.html";
      } catch {
        alert("Email hoặc mật khẩu không đúng");
      }
    });
  </script>
</body>
</html>
