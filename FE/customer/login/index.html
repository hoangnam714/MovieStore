<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập | Movie Store</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/customer.css" />
  </head>
  <body>
    <header id="header"></header>
    <main id="main">
      <div class="auth-layout">
        <section class="auth-art">
          <h1>Mỗi buổi xem là một câu chuyện đáng nhớ.</h1>
          <p>Chọn bộ phim bạn yêu thích, giữ chỗ và tìm lại vé bất cứ lúc nào.</p>
          <img
            class="film-poster"
            src="https://image.tmdb.org/t/p/w500/q719jXXEzOoYaps6babgKnONONX.jpg"
            alt="Poster Your Name"
            referrerpolicy="no-referrer"
          />
        </section>
        <section class="auth-form">
          <span class="eyebrow">CHÀO MỪNG TRỞ LẠI</span>
          <h1>Đăng nhập</h1>
          <p class="muted">Tiếp tục hành trình điện ảnh của bạn.</p>
          <form id="auth-form" onsubmit="onLogin(event)">
            <label class="field">
              Email
              <input
                name="email"
                type="email"
                class="input"
                required
                autocomplete="email"
                placeholder="ban@example.com"
              />
            </label>
            <label class="field">
              Mật khẩu
              <input
                name="password"
                type="password"
                class="input"
                required
                minlength="6"
                autocomplete="current-password"
                placeholder="Tối thiểu 6 ký tự"
              />
            </label>
            <p class="text-end tiny mb-0">
              <a href="../forgot-password/index.html">Quên mật khẩu?</a>
            </p>
            <p id="auth-success" class="success-message tiny" role="status" hidden>
              Đã đặt lại mật khẩu. Vui lòng đăng nhập bằng mật khẩu mới.
            </p>
            <p id="auth-error" class="error tiny" role="alert"></p>
            <button id="auth-submit" class="btn full" type="submit">Đăng nhập ↗</button>
          </form>
          <p class="auth-foot">
            Chưa có tài khoản?
            <a href="../register/index.html">Đăng ký ngay</a>
          </p>
        </section>
      </div>
    </main>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/customer-layout.js"></script>
    <script>
      const form = document.getElementById("auth-form");
      const errorMessage = document.getElementById("auth-error");

      function onLogin(event) {
        event.preventDefault();
        const submitButton = document.getElementById("auth-submit");
        submitButton.disabled = true;
        errorMessage.textContent = "";
        const values = Object.fromEntries(new FormData(form));

        return userApi
          .login(values)
          .then((response) => {
            const data = response.data;
            onSaveUser(data);
            const next = new URLSearchParams(location.search).get("next");
            const destination = next ? new URL(next, location.href) : null;
            const isCustomerPage =
              destination &&
              destination.origin === location.origin &&
              destination.pathname.startsWith("/customer/");
            location.href = isCustomerPage ? destination.href : "../home/index.html";
          })
          .catch((error) => {
            errorMessage.textContent =
              error?.response?.data?.message ||
              "Đăng nhập chưa thành công. Vui lòng kiểm tra email và mật khẩu.";
            submitButton.disabled = false;
          });
      }

      document.getElementById("auth-success").hidden =
        new URLSearchParams(location.search).get("reset") !== "1";
    </script>
  </body>
</html>
