<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng ký tài khoản | Movie Store</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/customer.css" />
  </head>
  <body>
    <header id="header"></header>
    <main id="main">
      <div class="auth-layout">
        <section class="auth-art">
          <h1>
            MOVIESTORE
            <br />
            THÀNH VIÊN
          </h1>
          <p>Đăng nhập để đặt vé và quản lý lịch sử xem phim.</p>
          <img
            class="film-poster"
            src="https://image.tmdb.org/t/p/w500/q719jXXEzOoYaps6babgKnONONX.jpg"
            alt="Poster Your Name"
            referrerpolicy="no-referrer"
          />
        </section>
        <section class="auth-form">
          <span class="eyebrow">MOVIE STORE MEMBERS</span>
          <h1>Đăng ký tài khoản</h1>
          <p class="muted">Điền thông tin bên dưới để tạo tài khoản.</p>
          <form id="auth-form">
            <label class="field">
              Họ và tên
              <input
                name="fullName"
                class="input"
                required
                minlength="2"
                maxlength="100"
                autocomplete="name"
                placeholder="Nguyễn Minh Anh"
              />
            </label>
            <label class="field">
              Email
              <input
                name="email"
                type="email"
                class="input"
                required
                autocomplete="email"
                placeholder="ban@example.com"
              />
            </label>
            <label class="field">
              Mật khẩu
              <input
                name="password"
                type="password"
                class="input"
                required
                minlength="6"
                autocomplete="new-password"
                placeholder="Tối thiểu 6 ký tự"
              />
            </label>
            <p id="auth-error" class="error tiny" role="alert"></p>
            <button id="auth-submit" class="btn full" type="submit">Tạo tài khoản ↗</button>
          </form>
          <p class="auth-foot">
            Đã có tài khoản?
            <a href="../login/index.html">Đăng nhập</a>
          </p>
        </section>
      </div>
    </main>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/customer-layout.js"></script>
    <script>
      const form = document.getElementById("auth-form");
      const errorMessage = document.getElementById("auth-error");

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        const submitButton = document.getElementById("auth-submit");
        submitButton.disabled = true;
        errorMessage.textContent = "";
        const values = Object.fromEntries(new FormData(form));

        return userApi
          .register({ ...values, role: "CUSTOMER" })
          .then((response) => {
            const data = response.data;
            onSaveUser(data);
            const next = new URLSearchParams(location.search).get("next");
            const destination = next ? new URL(next, location.href) : null;
            const isCustomerPage =
              destination &&
              destination.origin === location.origin &&
              destination.pathname.startsWith("/customer/");
            location.href = isCustomerPage ? destination.href : "../home/index.html";
          })
          .catch((error) => {
            console.error(error);
          });
      });
    </script>
  </body>
</html>
