<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản lý đặt vé | Movie Store CMS</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/admin.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="hold-transition sidebar-mini layout-fixed" data-page="tickets">
    <div class="wrapper">
      <div id="admin-layout"></div>
      <div class="content-wrapper">
        <section class="content-header">
          <div class="container-fluid">
            <h1>Quản lý đặt vé</h1>
            <p class="cms-subtitle">MOVIE STORE / QUẢN TRỊ RẠP CHIẾU</p>
          </div>
        </section>
        <section class="content">
          <div class="container-fluid">
            <p id="page-error" class="text-danger" role="alert"></p>
            <div id="main-content">
              <div class="card"><div class="card-body">
                <div class="row mb-3">
                  <div class="col-md-4 mb-2"><input id="ticket-search" class="form-control" placeholder="Tìm khách, email, SĐT, phim hoặc mã vé" oninput="renderTickets()" aria-label="Tìm vé"></div>
                  <div class="col-md-3 mb-2"><select id="ticket-cinema" class="form-control" onchange="renderTickets()" aria-label="Lọc cụm rạp"><option value="">Tất cả cụm rạp</option></select></div>
                  <div class="col-md-3 mb-2"><input id="ticket-date" class="form-control" type="date" onchange="renderTickets()" aria-label="Lọc ngày chiếu"></div>
                  <div class="col-md-2 mb-2"><button class="btn btn-outline-secondary btn-block" onclick="resetFilters()">Xóa lọc</button></div>
                </div>
                <p id="ticket-summary" class="font-weight-bold"></p>
              <table class="table table-bordered table-sm table-hover">
                <thead>
                  <tr>
                    <th>Khách</th>
                    <th>Phim</th>
                    <th>Phòng</th>
                    <th>Cụm rạp</th>
                    <th>Suất</th>
                    <th>Ghế</th>
                    <th>Thanh toán</th>
                    <th>Đặt lúc</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="tickets-rows"></tbody>
              </table>
              </div></div>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/admin-layout.js"></script>
    <script>
      let tickets = [];
      function onTickets() {
        return Promise.all([ticketApi.list(), cinemaApi.list()]).then(([response, cinemas]) => {
          tickets = response.data;
          document.getElementById('ticket-cinema').innerHTML += cinemas.data.map(c => `<option value="${c.id}">${getSafeHtml(c.name)}</option>`).join('');
          renderTickets();
        });
      }

      function renderTickets() {
        const keyword = document.getElementById('ticket-search').value.trim().toLocaleLowerCase('vi');
        const cinemaId = document.getElementById('ticket-cinema').value;
        const day = document.getElementById('ticket-date').value;
        const data = tickets.filter(ticket =>
          (!cinemaId || String(ticket.cinemaId) === cinemaId) &&
          (!day || getDateKey(ticket.startTime) === day) &&
          (!keyword || [ticket.id, ticket.userFullName, ticket.userEmail, ticket.customerPhone, ticket.movieTitle].some(value => String(value || '').toLocaleLowerCase('vi').includes(keyword)))
        );
        document.getElementById('ticket-summary').textContent = `${data.length} vé · Doanh thu ${getMoney(data.reduce((total, ticket) => total + Number(ticket.totalAmount), 0))}`;
        document.getElementById("tickets-rows").innerHTML = `${data
            .map(
              (ticket) => `
                <tr>
                  <td>
                    ${ticket.guest ? '<span class="badge badge-secondary">Khách vãng lai</span>' : getSafeHtml(ticket.userFullName)}
                    <small class="text-muted">#${ticket.id}</small>
                    <br />
                    <small>${getSafeHtml([ticket.userEmail, ticket.customerPhone].filter(Boolean).join(' · '))}</small>
                  </td>
                  <td>${getSafeHtml(ticket.movieTitle)}</td>
                  <td>${getSafeHtml(ticket.roomName)}</td>
                  <td>${getSafeHtml(ticket.cinemaName || 'Chưa phân cụm')}</td>
                  <td>${getDateTime(ticket.startTime)}</td>
                  <td>${getSeatLabel(ticket.seatNumber)}</td>
                  <td>
                    ${getMoney(ticket.totalAmount)}
                    <br />
                    <small class="text-muted">Gốc ${getMoney(ticket.price)}${Number(ticket.discountAmount) ? ' · Giảm ' + getMoney(ticket.discountAmount) : ''}${ticket.discountCode ? ' (' + getSafeHtml(ticket.discountCode) + ')' : ''} · VAT ${getMoney(ticket.vatAmount)}</small>
                  </td>
                  <td>${getDateTime(ticket.bookedAt)}</td>
                  <td><button class="btn btn-sm btn-outline-danger" ${new Date(ticket.startTime) <= new Date() ? 'disabled' : ''} onclick="cancelTicket(${ticket.id})">Hủy vé</button></td>
                </tr>
              `
            )
            .join("") || '<tr><td colspan="9" class="text-center">Không có vé phù hợp.</td></tr>'}`;
      }
      function resetFilters() {
        document.getElementById('ticket-search').value = '';
        document.getElementById('ticket-cinema').value = '';
        document.getElementById('ticket-date').value = '';
        renderTickets();
      }
      function cancelTicket(id) {
        if (!confirm(`Hủy vé #${id}? Ghế sẽ mở lại cho khách khác.`)) return;
        ticketApi.cancel(id).then(() => ticketApi.list()).then(({data}) => {
          tickets = data;
          renderTickets();
          onAdminMessage('Đã hủy vé và mở lại ghế.');
        }).catch(error => { document.getElementById('page-error').textContent = error?.response?.data?.message || 'Không thể hủy vé.'; });
      }

      onAdminPage(onTickets);
    </script>
  </body>
</html>
