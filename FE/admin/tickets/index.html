<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vé đã bán | Movie Store CMS</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/admin.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="hold-transition sidebar-mini layout-fixed" data-page="tickets">
    <div class="wrapper">
      <div id="admin-layout"></div>
      <div class="content-wrapper">
        <section class="content-header">
          <div class="container-fluid">
            <h1>Vé đã bán</h1>
            <p class="cms-subtitle">MOVIE STORE / QUẢN TRỊ RẠP CHIẾU</p>
          </div>
        </section>
        <section class="content">
          <div class="container-fluid">
            <p id="page-error" class="text-danger" role="alert"></p>
            <div id="main-content">
              <table class="table table-bordered table-sm">
                <thead>
                  <tr>
                    <th>Khách</th>
                    <th>Phim</th>
                    <th>Phòng</th>
                    <th>Suất</th>
                    <th>Ghế</th>
                    <th>Giá</th>
                    <th>Đặt lúc</th>
                  </tr>
                </thead>
                <tbody id="tickets-rows"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/admin-layout.js"></script>
    <script>
      function onTickets(content) {
        return ticketApi.list().then((response) => {
          const data = response.data;
          document.getElementById("tickets-rows").innerHTML = `${data
            .map(
              (ticket) => `
                <tr>
                  <td>
                    ${ticket.userFullName}
                    <br />
                    <small>${ticket.userEmail}</small>
                  </td>
                  <td>${ticket.movieTitle}</td>
                  <td>${ticket.roomName}</td>
                  <td>${getDateTime(ticket.startTime)}</td>
                  <td>${ticket.seatNumber}</td>
                  <td>${getMoney(ticket.price)}</td>
                  <td>${getDateTime(ticket.bookedAt)}</td>
                </tr>
              `
            )
            .join("")}`;
        });
      }

      onAdminPage(onTickets);
    </script>
  </body>
</html>
