<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập CMS | Movie Store</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/admin.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="hold-transition login-page">
    <div class="login-box">
      <div class="card card-outline card-primary">
        <div class="card-header text-center">
          <h1 class="h3">Movie Store CMS</h1>
          <p class="text-muted mb-0">Quản lý rạp phim (AdminLTE 3)</p>
        </div>
        <div class="card-body">
          <form id="login-form">
            <div class="input-group mb-3">
              <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Email admin"
                required
                value="admin@moviestore.vn"
              />
              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-envelope"></span>
                </div>
              </div>
            </div>
            <div class="input-group mb-3">
              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Mật khẩu"
                required
                value="admin123"
              />
              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-lock"></span>
                </div>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
          </form>
          <p class="mt-3 mb-0 text-center">
            <a href="../../customer/home/index.html">← Về trang khách</a>
          </p>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script>
      document.getElementById("login-form").addEventListener("submit", (e) => {
        e.preventDefault();

        return userApi
          .login({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          })
          .then((response) => {
            const data = response.data;
            if (data.role !== "ADMIN") {
              alert("Tài khoản không có quyền quản trị");
              return;
            }
            onSaveUser(data);
            location.href = "../dashboard/index.html";
          })
          .catch((error) => {
            console.error(error);
          });
      });
    </script>
  </body>
</html>
