<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Suất chiếu | Movie Store CMS</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/admin.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="hold-transition sidebar-mini layout-fixed" data-page="showtimes">
    <div class="wrapper">
      <div id="admin-layout"></div>
      <div class="content-wrapper">
        <section class="content-header">
          <div class="container-fluid">
            <h1>Suất chiếu</h1>
            <p class="cms-subtitle">MOVIE STORE / QUẢN TRỊ RẠP CHIẾU</p>
          </div>
        </section>
        <section class="content">
          <div class="container-fluid" id="main-content">
            <div class="card showtime-editor" id="showtime-editor">
              <div class="card-body">
                <div class="section-heading">
                  <div>
                    <span class="section-kicker">LÊN LỊCH CHIẾU</span>
                    <h2 id="form-title">Tạo suất chiếu mới</h2>
                    <p>Tìm phim theo tên, chọn cụm rạp và kiểm tra thời gian trước khi lưu.</p>
                  </div>
                  <span class="section-symbol" aria-hidden="true"
                    ><i class="fas fa-calendar-plus"></i
                  ></span>
                </div>
                <form id="st-form" onsubmit="onSaveShowtime(event)">
                  <div class="form-row">
                    <div class="col-lg-4 col-md-6">
                      <label for="movie-search">Tìm tên phim</label>
                      <input
                        id="movie-search"
                        class="form-control"
                        type="search"
                        placeholder="Ví dụ: Dune, Mai..."
                        autocomplete="off"
                        oninput="onMovieSearch()"
                      />
                      <small id="movie-search-results" class="form-help" aria-live="polite"></small>
                    </div>
                    <div class="col-lg-4 col-md-6">
                      <label for="showtime-movie">Phim sẽ chiếu</label>
                      <select id="showtime-movie" class="form-control" name="movieId" required>
                        <option value="">Chọn phim</option>
                      </select>
                    </div>
                    <div class="col-lg-4 col-md-6">
                      <label for="showtime-cinema">Cụm rạp</label>
                      <select
                        id="showtime-cinema"
                        class="form-control"
                        onchange="onCinemaChanged()"
                        required
                      >
                        <option value="">Chọn cụm rạp</option>
                      </select>
                    </div>
                    <div class="col-lg-4 col-md-6">
                      <label for="showtime-room">Phòng chiếu</label>
                      <select id="showtime-room" class="form-control" name="roomId" required>
                        <option value="">Chọn phòng</option>
                      </select>
                    </div>
                    <div class="col-lg-4 col-md-6">
                      <label for="showtime-start">Ngày và giờ bắt đầu</label>
                      <input
                        id="showtime-start"
                        class="form-control"
                        name="startTime"
                        type="datetime-local"
                        required
                      />
                    </div>
                    <div class="col-lg-4 col-md-6">
                      <label for="showtime-price">Giá vé (VND)</label>
                      <input
                        id="showtime-price"
                        class="form-control"
                        name="ticketPrice"
                        type="number"
                        min="0"
                        step="1000"
                        placeholder="Ví dụ: 95000"
                        required
                      />
                    </div>
                  </div>
                  <div class="editor-actions">
                    <p id="showtime-error" class="text-danger mb-0" role="alert"></p>
                    <div class="editor-buttons">
                      <button
                        type="button"
                        id="cancel-edit"
                        class="btn btn-outline-secondary"
                        onclick="onCancelEdit()"
                        hidden
                      >
                        Hủy sửa
                      </button>
                      <button type="submit" id="save-showtime" class="btn btn-primary">
                        <i class="fas fa-plus mr-1"></i> Tạo suất chiếu
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>

            <div class="card">
              <div class="card-body">
                <div class="section-heading list-heading">
                  <div>
                    <span class="section-kicker">QUẢN LÝ LỊCH</span>
                    <h2>Lịch chiếu theo phòng</h2>
                    <p id="showtime-summary" aria-live="polite">Đang tải dữ liệu...</p>
                  </div>
                </div>
                <div class="filter-bar">
                  <div class="filter-search">
                    <i class="fas fa-search" aria-hidden="true"></i
                    ><input
                      id="list-search"
                      class="form-control"
                      type="search"
                      placeholder="Tìm phim hoặc phòng..."
                      aria-label="Tìm phim hoặc phòng"
                      oninput="onScheduleSearchInput()"
                    />
                  </div>
                  <div class="schedule-date-picker">
                    <button
                      type="button"
                      class="btn btn-outline-secondary"
                      onclick="onChangeDate(-1)"
                      aria-label="Ngày trước"
                    >
                      <i class="fas fa-chevron-left" aria-hidden="true"></i>
                    </button>
                    <input
                      id="list-date"
                      class="form-control"
                      type="date"
                      aria-label="Ngày chiếu"
                      onchange="onListFilter()"
                    />
                    <button
                      type="button"
                      class="btn btn-outline-secondary"
                      onclick="onChangeDate(1)"
                      aria-label="Ngày sau"
                    >
                      <i class="fas fa-chevron-right" aria-hidden="true"></i>
                    </button>
                  </div>
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    onclick="onClearFilters()"
                  >
                    Xóa lọc
                  </button>
                </div>
                <fieldset class="cinema-filter">
                  <legend>Cụm rạp <span>· Có thể chọn nhiều rạp</span></legend>
                  <div class="cinema-options">
                    <button
                      type="button"
                      id="all-cinemas"
                      class="cinema-all active"
                      aria-pressed="true"
                      onclick="onSelectAllCinemas()"
                    >
                      Tất cả rạp
                    </button>
                    <div id="list-cinemas" class="cinema-options"></div>
                  </div>
                </fieldset>
                <p id="schedule-error" class="text-danger" role="alert"></p>
                <div id="showtime-schedule" class="showtime-schedule" aria-busy="false"></div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/admin-layout.js"></script>
    <script>
      let schedule = { cinemas: [] };
      let scheduleRequestId = 0;
      let scheduleSearchTimer = null;
      let movies = [];
      let rooms = [];
      let cinemas = [];
      let editingShowtimeId = null;

      function getNormalizedSearch(value) {
        return String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/đ/g, "d")
          .replace(/Đ/g, "D")
          .toLocaleLowerCase("vi");
      }

      function onShowtimes() {
        return Promise.all([movieApi.list(), roomApi.list(), cinemaApi.list()])
          .then(([movieResponse, roomResponse, cinemaResponse]) => {
            movies = movieResponse.data.movies;
            rooms = roomResponse.data;
            cinemas = cinemaResponse.data;
            if (rooms.some((room) => !room.cinemaId)) {
              cinemas.push({ id: null, name: "Chưa phân cụm", address: "" });
            }
            const options = cinemas
              .filter((cinema) => cinema.id)
              .map(
                (cinema) => `
                  <option value="${cinema.id}">${getSafeHtml(cinema.name)}</option>
                `
              )
              .join("");
            document.getElementById("showtime-cinema").insertAdjacentHTML("beforeend", options);
            document.getElementById("list-cinemas").innerHTML = cinemas
              .map(
                (cinema) => `
                <label class="cinema-option">
                  <input type="checkbox" value="${cinema.id || 0}" onchange="onListFilter()" />
                  <span>${getSafeHtml(cinema.name)}</span>
                </label>
              `
              )
              .join("");
            document.getElementById("list-date").value = getLocalDateKey(new Date());
            onMovieSearch();
            onCinemaChanged();
            onCancelEdit();
            return onLoadSchedule();
          })
          .catch((error) => {
            document.getElementById("showtime-error").textContent =
              "Không tải được lịch chiếu. Vui lòng tải lại trang.";
            throw error;
          });
      }

      function onMovieSearch() {
        const keyword = getNormalizedSearch(document.getElementById("movie-search").value.trim());
        const select = document.getElementById("showtime-movie");
        const selected = select.value;
        const matches = movies.filter((movie) =>
          getNormalizedSearch(movie.title).includes(keyword)
        );
        select.innerHTML =
          '<option value="">Chọn phim</option>' +
          matches
            .map(
              (movie) => `
                <option value="${movie.id}">${getSafeHtml(movie.title)} · ${movie.duration} phút</option>
              `
            )
            .join("");
        if (matches.some((movie) => String(movie.id) === selected)) select.value = selected;
        if (matches.length === 1 && keyword) select.value = String(matches[0].id);
        document.getElementById("movie-search-results").textContent = matches.length
          ? `${matches.length} phim phù hợp`
          : "Không tìm thấy phim. Thử từ khóa khác.";
      }

      function onCinemaChanged() {
        const cinemaId = document.getElementById("showtime-cinema").value;
        const select = document.getElementById("showtime-room");
        const selected = select.value;
        const matches = rooms.filter((room) => cinemaId && String(room.cinemaId) === cinemaId);
        select.innerHTML =
          '<option value="">Chọn phòng</option>' +
          matches
            .map(
              (room) => `
                <option value="${room.id}">${getSafeHtml(room.name)} · ${room.seatCount} ghế</option>
              `
            )
            .join("");
        select.disabled = !cinemaId;
        if (matches.some((room) => String(room.id) === selected)) select.value = selected;
      }

      function onListFilter() {
        return onLoadSchedule();
      }

      function onScheduleSearchInput() {
        clearTimeout(scheduleSearchTimer);
        scheduleRequestId++;
        scheduleSearchTimer = setTimeout(() => onLoadSchedule(), 300);
      }

      function getLocalDateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function onChangeDate(offset) {
        const input = document.getElementById("list-date");
        const date = new Date(`${input.value || getLocalDateKey(new Date())}T12:00:00`);
        date.setDate(date.getDate() + offset);
        input.value = getLocalDateKey(date);
        return onLoadSchedule();
      }

      function onSelectAllCinemas() {
        document.querySelectorAll("#list-cinemas input").forEach((checkbox) => {
          checkbox.checked = false;
        });
        return onLoadSchedule();
      }

      function onClearFilters() {
        document.getElementById("list-search").value = "";
        document.getElementById("list-date").value = getLocalDateKey(new Date());
        onSelectAllCinemas();
      }

      function onLoadSchedule() {
        clearTimeout(scheduleSearchTimer);
        const requestId = ++scheduleRequestId;
        const selected = [...document.querySelectorAll("#list-cinemas input:checked")].map(
          (checkbox) => checkbox.value
        );
        const dateInput = document.getElementById("list-date");
        if (!dateInput.value) dateInput.value = getLocalDateKey(new Date());
        const params = {
          date: dateInput.value,
          cinemaIds: selected.length ? selected.join(",") : undefined,
          keyword: document.getElementById("list-search").value.trim() || undefined
        };
        const container = document.getElementById("showtime-schedule");
        const allButton = document.getElementById("all-cinemas");
        allButton.classList.toggle("active", !selected.length);
        allButton.setAttribute("aria-pressed", String(!selected.length));
        document.getElementById("schedule-error").textContent = "";
        document.getElementById("showtime-summary").textContent = "Đang tải lịch chiếu...";
        container.setAttribute("aria-busy", "true");
        container.innerHTML = '<p class="schedule-empty">Đang tải lịch chiếu...</p>';
        schedule = { cinemas: [] };
        return showtimeApi
          .schedule(params)
          .then(({ data }) => {
            if (requestId !== scheduleRequestId) return;
            schedule = data;
            onRenderShowtimes();
          })
          .catch((error) => {
            if (requestId !== scheduleRequestId) return;
            document.getElementById("schedule-error").textContent =
              error?.response?.data?.message || "Không tải được lịch chiếu. Vui lòng thử lại.";
            document.getElementById("showtime-summary").textContent = "Không tải được lịch chiếu";
            container.innerHTML =
              '<button type="button" class="btn btn-outline-secondary" onclick="onLoadSchedule()">Thử lại</button>';
          })
          .finally(() => {
            if (requestId === scheduleRequestId) container.setAttribute("aria-busy", "false");
          });
      }

      function onRenderShowtimes() {
        document.getElementById("showtime-summary").textContent =
          `${schedule.date.split("-").reverse().join("/")} · ${schedule.totalShowtimes} suất chiếu · ${schedule.cinemas.length} cụm rạp`;
        document.getElementById("showtime-schedule").innerHTML =
          schedule.cinemas.map(getCinemaSchedule).join("") ||
          '<p class="empty-list">Không có suất chiếu phù hợp. Hãy đổi bộ lọc hoặc tạo suất mới.</p>';
      }

      function getCinemaSchedule(cinema) {
        return `
          <section class="schedule-cinema" aria-label="${getSafeHtml(cinema.name)}">
            <div class="schedule-cinema-heading">
              <div>
                <h3><i class="fas fa-building" aria-hidden="true"></i> ${getSafeHtml(cinema.name)}</h3>
                ${cinema.address ? `<p>${getSafeHtml(cinema.address)}</p>` : ""}
              </div>
              <span class="schedule-count">${cinema.totalShowtimes} suất chiếu</span>
            </div>
            ${cinema.rooms.map(getRoomSchedule).join("") || '<p class="schedule-empty">Cụm rạp chưa có phòng chiếu.</p>'}
          </section>
        `;
      }

      function getRoomSchedule(room) {
        return `
          <div class="schedule-room">
            <div class="schedule-room-heading">
              <h4>${getSafeHtml(room.name)}</h4>
              <span>${room.seatCount} ghế · ${room.showtimes.length} suất</span>
            </div>
            <div class="schedule-cards">
              ${
                room.showtimes.map(getShowtimeCard).join("") ||
                '<p class="schedule-empty">Chưa có suất chiếu trong ngày.</p>'
              }
            </div>
          </div>
        `;
      }

      function getShowtimeCard(showtime) {
        const isPast = new Date(showtime.startTime) <= new Date();
        const nextDay = getDateKey(showtime.endTime) !== getDateKey(showtime.startTime);
        return `
          <article class="schedule-showtime" data-showtime-id="${showtime.id}">
            <div class="schedule-time">
              <strong>${getTime(showtime.startTime)}</strong>
              <span>→ ${getTime(showtime.endTime)}${nextDay ? " (+1 ngày)" : ""}</span>
            </div>
            <h5>${getSafeHtml(showtime.movieTitle)}</h5>
            <p class="schedule-duration">${showtime.movieDuration} phút ${isPast ? "· Đã bắt đầu" : ""}</p>
            <div class="schedule-card-footer">
              <strong class="schedule-price">${getMoney(showtime.ticketPrice)}</strong>
              <div class="schedule-card-actions">
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="onEditShowtime(${showtime.id})" aria-label="Sửa suất ${getSafeHtml(showtime.movieTitle)} lúc ${getTime(showtime.startTime)}">Sửa</button>
                <button type="button" class="btn btn-sm btn-outline-danger" onclick="onDeleteShowtime(${showtime.id})" aria-label="Xóa suất ${getSafeHtml(showtime.movieTitle)} lúc ${getTime(showtime.startTime)}">Xóa</button>
              </div>
            </div>
          </article>
        `;
      }

      function getScheduleShowtime(id) {
        for (const cinema of schedule.cinemas) {
          for (const room of cinema.rooms) {
            for (const showtime of room.showtimes) {
              if (showtime.id === id) return showtime;
            }
          }
        }
        return null;
      }

      function onEditShowtime(id) {
        const showtime = getScheduleShowtime(id);
        if (!showtime) return;
        editingShowtimeId = id;
        const form = document.getElementById("st-form");
        document.getElementById("movie-search").value = showtime.movieTitle;
        onMovieSearch();
        form.elements.movieId.value = String(showtime.movieId);
        document.getElementById("showtime-cinema").value = String(showtime.cinemaId || "");
        onCinemaChanged();
        form.elements.roomId.value = String(showtime.roomId);
        form.elements.startTime.value = showtime.startTime.slice(0, 16);
        form.elements.ticketPrice.value = showtime.ticketPrice;
        document.getElementById("form-title").textContent = `Sửa suất #${id}`;
        document.getElementById("save-showtime").innerHTML =
          '<i class="fas fa-check mr-1"></i> Lưu thay đổi';
        document.getElementById("cancel-edit").hidden = false;
        document.getElementById("showtime-error").textContent = "";
        document
          .getElementById("showtime-editor")
          .scrollIntoView({ behavior: "smooth", block: "start" });
        document.getElementById("movie-search").focus();
      }

      function onCancelEdit() {
        editingShowtimeId = null;
        const form = document.getElementById("st-form");
        form.reset();
        document.getElementById("movie-search").value = "";
        document.getElementById("showtime-cinema").value = "";
        onMovieSearch();
        onCinemaChanged();
        document.getElementById("form-title").textContent = "Tạo suất chiếu mới";
        document.getElementById("save-showtime").innerHTML =
          '<i class="fas fa-plus mr-1"></i> Tạo suất chiếu';
        document.getElementById("cancel-edit").hidden = true;
        document.getElementById("showtime-error").textContent = "";
      }

      function getShowtimeErrorMessage(error) {
        const raw = error?.response?.data?.message || "";
        if (raw.includes("overlaps"))
          return "Phòng đã có suất chiếu trùng giờ. Hãy chọn thời gian hoặc phòng khác.";
        if (raw.includes("tickets")) return "Suất này đã có vé đặt; chỉ có thể thay đổi giá vé.";
        return raw || "Không lưu được suất chiếu. Vui lòng kiểm tra thông tin và thử lại.";
      }

      function onSaveShowtime(event) {
        event.preventDefault();
        const form = event.target;
        const errorNode = document.getElementById("showtime-error");
        const button = document.getElementById("save-showtime");
        errorNode.textContent = "";
        if (!form.elements.movieId.value || !form.elements.roomId.value) {
          errorNode.textContent = "Vui lòng chọn phim và phòng chiếu trong danh sách.";
          return;
        }
        if (!editingShowtimeId && new Date(form.elements.startTime.value) <= new Date()) {
          errorNode.textContent = "Giờ chiếu phải ở trong tương lai.";
          return;
        }
        const data = {
          movieId: Number(form.elements.movieId.value),
          roomId: Number(form.elements.roomId.value),
          startTime:
            form.elements.startTime.value.length === 16
              ? `${form.elements.startTime.value}:00`
              : form.elements.startTime.value,
          ticketPrice: Number(form.elements.ticketPrice.value)
        };
        button.disabled = true;
        const request = editingShowtimeId
          ? showtimeApi.update(editingShowtimeId, data)
          : showtimeApi.create(data);
        return request
          .then(() => {
            document.getElementById("list-date").value = getDateKey(data.startTime);
            document.getElementById("list-search").value = "";
            const savedRoom = rooms.find((room) => room.id === data.roomId);
            const selected = document.querySelectorAll("#list-cinemas input:checked");
            if (selected.length && savedRoom) {
              document.querySelectorAll("#list-cinemas input").forEach((checkbox) => {
                if (checkbox.value === String(savedRoom.cinemaId || 0)) checkbox.checked = true;
              });
            }
            onAdminMessage(
              editingShowtimeId ? "Đã cập nhật suất chiếu." : "Đã tạo suất chiếu mới."
            );
            onCancelEdit();
            return onLoadSchedule();
          })
          .catch((error) => {
            errorNode.textContent = getShowtimeErrorMessage(error);
          })
          .finally(() => {
            button.disabled = false;
          });
      }

      function onDeleteShowtime(id) {
        const item = getScheduleShowtime(id);
        if (!item || !confirm(`Xóa suất ${item.movieTitle} lúc ${getDateTime(item.startTime)}?`))
          return;
        return showtimeApi
          .remove(id)
          .then(() => {
            if (editingShowtimeId === id) onCancelEdit();
            onAdminMessage("Đã xóa suất chiếu.");
            return onLoadSchedule();
          })
          .catch((error) => {
            document.getElementById("showtime-error").textContent = getShowtimeErrorMessage(error);
            document.getElementById("showtime-editor").scrollIntoView({ behavior: "smooth" });
          });
      }

      onAdminPage(onShowtimes);
    </script>
  </body>
</html>
